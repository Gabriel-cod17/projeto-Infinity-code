<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinity Code</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <!-- Fonts Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Header -->
    <header id="header" class="header">
      <img
        class="img_Logo"
        src="assets/img/Logo-Infinity-code.webp"
        alt="Logo da Infinity Code / Agência de landing page / site"
        loading="eager"
      />
      <nav id="nav" class="nav">
        <a href="">Início</a>
        <a href="">Soluções</a>
        <a href="">Funcionalidade</a>
        <a href="">Preços</a>
        <a href="">FAQ</a>
        <a href="">
          <button class="bt_Nav">Comece Agora</button>
        </a>
      </nav>
    </header>
    <!-- main -->
    <main id="main" class="main">
      <section id="section_Main" class="section_Main">
        <div class="div_One_Section">
          <h1 class="h1_Transforme">
            Transforme ideias <br />
            em realidade com <br />código de Ponta.
          </h1>
          <h2 class="h2_Infinity">
            A <strong>Infinity Code</strong> é sua parceira estratégica para
            <br />
            inovação tecnológica e desenvolvimento de <br />software
            excepcional.
          </h2>

          <!-- div dentro -->

          <div class="button_div_one">
            <a href="">
              <button class="bt-one">Descubra Nossas Soluções</button>
            </a>
            <a href="">
              <button class="bt-two">Fale Conosco</button>
            </a>
          </div>
        </div>
        <!-- div -->
        <div class="div_Two_Section">
          <video autoplay muted loop class="video">
            <source src="assets/img/Logo-em-movimento.webm" type="" />
          </video>
        </div>
      </section>
    </main>
    <script src="assets/js/arquivo.js"></script>
  </body>
</html>
